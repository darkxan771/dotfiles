[formatting]
line_length = 80

[snippets]
include_default_snippets = true
custom_paths = []

[save]
format_on_save = true
autosave_delay = 1000
autosave = "after_delay"

[mcp]
presets = []

[mcp.mcpServers]

[diagnostics]
sql_linter = true
enabled = false

[ai.models]
custom_models = []
displayed_models = []

[ai.custom_providers]

[server]
browser = "default"
follow_symlink = false

[language_servers.basedpyright]
enabled = false

[language_servers.pylsp]
enable_pylint = false
enable_flake8 = false
enable_pydocstyle = false
enable_mypy = true
enable_ruff = true
enable_pyflakes = false
enabled = true

[keymap]
preset = "default"

[keymap.overrides]

[package_management]
manager = "pip"

[display]
default_width = "medium"
reference_highlighting = true
theme = "light"
dataframes = "rich"
default_table_page_size = 10
code_editor_font_size = 14
cell_output = "below"
default_table_max_columns = 50

[runtime]
default_csv_encoding = "utf-8"
output_max_bytes = 8000000
auto_reload = "off"
std_stream_max_bytes = 1000000
default_sql_output = "auto"
on_cell_change = "autorun"
watcher_on_save = "lazy"
auto_instantiate = false
reactive_tests = true

[completion]
signature_hint_on_typing = true
copilot = false
activate_on_typing = true
